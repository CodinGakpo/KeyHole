<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark-1 — run evidence</title>
<style>
  :root{
    --ink:#0B0F14; --panel:#121A22; --panel-2:#0F161D; --line:#22303C;
    --fg:#E6EDF3; --mut:#8494A3; --dim:#5C6B79;
    --released:#3FB950; --withheld:#E3B341; --fail:#F85149; --sig:#39C5CF;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--fg);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--sig)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim)}
  header{display:flex;align-items:baseline;gap:18px;padding:20px 26px;
    border-bottom:1px solid var(--line)}
  header .mark{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.02em}
  header .mark b{color:var(--sig)}
  header .tag{font-family:var(--mono);font-size:12px;color:var(--mut)}
  header .legend{margin-left:auto;display:flex;gap:16px;font-family:var(--mono);
    font-size:11px;color:var(--mut)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;
    vertical-align:middle}
  .dot.released{background:var(--released)} .dot.withheld{background:var(--withheld)}
  .dot.fail{background:var(--fail)}

  .wrap{display:grid;grid-template-columns:minmax(320px,420px) 1fr;height:calc(100% - 65px)}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;height:auto}}

  /* Ledger (left) */
  .ledger{border-right:1px solid var(--line);overflow-y:auto}
  .ledger .head{display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;position:sticky;top:0;background:var(--ink);border-bottom:1px solid var(--line)}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 22px;
    border-bottom:1px solid var(--panel-2);cursor:pointer;transition:background .12s}
  .row:hover{background:var(--panel-2)}
  .row[aria-selected=true]{background:var(--panel);box-shadow:inset 3px 0 0 var(--sig)}
  .row .rid{font-family:var(--mono);font-size:12.5px;color:var(--fg);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{font-family:var(--mono);font-size:11px;color:var(--dim);grid-column:1}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;border:1px solid;justify-self:end;align-self:start}
  .pill.released{color:var(--released);border-color:#204d2c;background:#0f2417}
  .pill.withheld{color:var(--withheld);border-color:#52441a;background:#241d0d}
  .pill.fail{color:var(--fail);border-color:#5b2321;background:#24110f}
  .sig{font-family:var(--mono);font-size:10.5px;justify-self:end}
  .sig.ok{color:var(--sig)} .sig.bad{color:var(--fail)} .sig.na{color:var(--dim)}

  /* Inspector (right) */
  .inspector{overflow-y:auto;padding:26px 30px}
  .empty{color:var(--dim);font-family:var(--mono);margin-top:12vh;text-align:center}
  .verdict{display:flex;align-items:center;gap:14px;margin:4px 0 22px}
  .verdict h1{font-size:26px;margin:0;font-weight:650;letter-spacing:-.01em}
  .verdict .rid{font-family:var(--mono);font-size:12px;color:var(--mut)}
  .reason{color:var(--withheld);font-family:var(--mono);font-size:12.5px;margin:-14px 0 22px}

  /* Signature element: the exit-bandwidth aperture */
  .aperture{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:20px 22px 16px;margin-bottom:22px}
  .aperture .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .aperture .bits{font-family:var(--mono);font-size:22px;color:var(--fg)}
  .aperture .bits small{color:var(--mut);font-size:12px}
  .gauge{position:relative;height:10px;border-radius:6px;background:
    linear-gradient(90deg,#0f2417,#141b12 40%,#241d0d 72%,#24110f);border:1px solid var(--line)}
  .gauge .marker{position:absolute;top:-5px;width:2px;height:20px;background:var(--sig);
    box-shadow:0 0 10px var(--sig);border-radius:2px;transition:left .5s ease}
  .ticks{position:relative;height:20px;margin-top:8px}
  .ticks span{position:absolute;transform:translateX(-50%);font-family:var(--mono);
    font-size:10px;color:var(--dim)}
  .aperture .note{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    margin-bottom:22px}
  .cell{background:var(--panel);padding:14px 16px}
  .cell .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim)}
  .cell .v{font-family:var(--mono);font-size:14px;margin-top:5px;word-break:break-all}

  .section-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:26px 0 12px}
  .hashes .h{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--panel-2);font-family:var(--mono);font-size:12px}
  .hashes .h .lbl{color:var(--mut)} .hashes .h .val{color:var(--fg);word-break:break-all}

  .timeline{border-left:1px solid var(--line);margin-left:6px;padding-left:18px}
  .ev{position:relative;padding:8px 0}
  .ev::before{content:"";position:absolute;left:-23px;top:14px;width:8px;height:8px;
    border-radius:50%;background:var(--dim)}
  .ev.denied::before{background:var(--fail)}
  .ev .kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .ev .detail{font-family:var(--mono);font-size:12.5px}
  .ev.denied .detail{color:var(--fail)}
  .none{color:var(--dim);font-family:var(--mono);font-size:12px}

  .drop{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;
    color:var(--dim);font-family:var(--mono);font-size:12px;transition:border-color .15s,color .15s}
  .drop.over{border-color:var(--sig);color:var(--sig)}
  .drop b{color:var(--fg)}
  .verify-out{margin-top:10px;font-family:var(--mono);font-size:12.5px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <span class="mark">MARK<b>·1</b></span>
  <span class="tag">run evidence &mdash; released, bounded, attested</span>
  <span class="legend">
    <span><span class="dot released"></span>released</span>
    <span><span class="dot withheld"></span>withheld</span>
    <span><span class="dot fail"></span>failed</span>
  </span>
</header>
<div class="wrap">
  <aside class="ledger">
    <div class="head"><span class="eyebrow">run ledger</span><span class="eyebrow" id="count"></span></div>
    <div id="rows"></div>
  </aside>
  <main class="inspector" id="inspector">
    <div class="empty">Select a run to inspect its evidence.</div>
  </main>
</div>
<script>
const S={released:"released",withheld:"withheld",failed:"fail",timeout:"fail",pending:"withheld",running:"withheld"};
const pill=s=>`<span class="pill ${S[s]||'fail'}">${s}</span>`;
const sigMark=v=> v===true?'<span class="sig ok">&#10003; VALID</span>'
  : v===false?'<span class="sig bad">&#10007; INVALID</span>'
  : '<span class="sig na">&mdash;</span>';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shortId=s=>s? s.replace(/^run-/,'').slice(0,12) : '';

async function loadRuns(){
  const runs=await (await fetch('/api/runs')).json();
  document.getElementById('count').textContent=runs.length+' run'+(runs.length===1?'':'s');
  const rows=document.getElementById('rows');
  if(!runs.length){rows.innerHTML='<div class="row"><span class="meta">No runs yet. Try: sbx run … --local</span></div>';return;}
  rows.innerHTML=runs.map(r=>`
    <div class="row" data-id="${esc(r.run_id)}" role="button" tabindex="0" aria-selected="false">
      <span class="rid">${esc(shortId(r.run_id))}</span>
      ${pill(r.status)}
      <span class="meta">${r.exit_bandwidth_bits!=null? r.exit_bandwidth_bits.toFixed(2)+' bits':'—'} &middot; ${r.created_at? esc(r.created_at.slice(0,19).replace('T',' ')):''}</span>
      ${sigMark(r.verified)}
    </div>`).join('');
  rows.querySelectorAll('.row').forEach(el=>{
    const go=()=>select(el);
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

function select(el){
  document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-selected','false'));
  el.setAttribute('aria-selected','true');
  detail(el.dataset.id);
}

// Log-scale aperture: place a bits value along 1 bit → 1MB.
function aperturePos(bits){
  const min=Math.log2(1), max=Math.log2(8*1024*1024); // 1 bit .. 1 MB
  const v=Math.max(1,bits||0);
  return Math.min(100,Math.max(0,(Math.log2(v)-min)/(max-min)*100));
}

async function detail(id){
  const res=await fetch('/api/runs/'+encodeURIComponent(id));
  const box=document.getElementById('inspector');
  if(!res.ok){box.innerHTML='<div class="empty">Run not found.</div>';return;}
  const d=await res.json(), r=d.result, a=d.audit, at=d.attestation;
  const bits=r.exit_bandwidth_bits||0;
  const marks=[[1,'1 bit'],[8,'1 B'],[8*1024,'1 KB'],[8*1024*1024,'1 MB']];
  box.innerHTML=`
    <div class="eyebrow">verdict</div>
    <div class="verdict">
      <h1>${r.status==='succeeded'?'Released':r.status==='withheld'?'Withheld':esc(r.status)}</h1>
      ${pill(r.status)}<span class="rid">${esc(r.run_id)}</span>
      <span style="margin-left:auto">${sigMark(d.verified)}</span>
    </div>
    ${r.withheld_reason?`<div class="reason">${esc(r.withheld_reason)}</div>`:''}

    <div class="aperture">
      <div class="cap">
        <span class="eyebrow">exit aperture</span>
        <span class="bits">${bits.toFixed(2)} <small>bits could leave</small></span>
      </div>
      <div class="gauge"><div class="marker" style="left:${aperturePos(bits)}%"></div></div>
      <div class="ticks">${marks.map(m=>`<span style="left:${aperturePos(m[0])}%">${m[1]}</span>`).join('')}</div>
      <div class="note">the released value is ${esc(JSON.stringify(r.output))} &mdash; bounded to the declared schema, not the dataset</div>
    </div>

    <div class="grid">
      <div class="cell"><div class="k">released value</div><div class="v">${r.output!=null?esc(JSON.stringify(r.output)):'&mdash; nothing'}</div></div>
      <div class="cell"><div class="k">egress denied</div><div class="v">${a?a.egress_denied+' / '+a.egress_attempts:'&mdash;'}</div></div>
      <div class="cell"><div class="k">dlp findings</div><div class="v">${a?a.dlp_findings:'&mdash;'}</div></div>
      <div class="cell"><div class="k">duration</div><div class="v">${r.duration_ms!=null?r.duration_ms+' ms':'&mdash;'}</div></div>
    </div>

    ${at&&at.dataset_id?`
    <div class="section-h">clean room &mdash; who ran whose data</div>
    <div class="grid">
      <div class="cell"><div class="k">data owner</div><div class="v">${esc(at.data_owner)}</div></div>
      <div class="cell"><div class="k">code provider</div><div class="v">${esc(at.code_provider)}</div></div>
      <div class="cell"><div class="k">dataset</div><div class="v">${esc(at.dataset_id)}</div></div>
    </div>`:''}

    <div class="section-h">bound hashes${at?' &mdash; '+esc(at.algorithm):''}</div>
    <div class="hashes">
      ${hashRow('code',a&&a.code_sha256)}
      ${hashRow('data',a&&a.data_sha256)}
      ${hashRow('schema',a&&a.schema_sha256)}
      ${hashRow('output',a&&a.output_sha256)}
      ${at?hashRow('signature',at.signature):''}
    </div>

    <div class="section-h">data-flow record</div>
    ${a&&a.events&&a.events.length? '<div class="timeline">'+a.events.map(ev=>`
      <div class="ev ${ev.denied?'denied':''}">
        <div class="kind">${esc(ev.kind)}${ev.denied?' &middot; denied':''}</div>
        <div class="detail">${esc(ev.detail)}</div>
      </div>`).join('')+'</div>' : '<div class="none">No events recorded for this run.</div>'}

    <div class="section-h">verify an attestation</div>
    <div class="drop" id="drop">Drop an <b>attestation .json</b> here to check its signature.</div>
    <div class="verify-out" id="vout"></div>`;
  wireDrop();
}
const hashRow=(l,v)=>`<div class="h"><span class="lbl">${l}</span><span class="val">${v?esc(v):'&mdash;'}</span></div>`;

function wireDrop(){
  const drop=document.getElementById('drop'), out=document.getElementById('vout');
  if(!drop) return;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{stop(e);drop.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{stop(e);drop.classList.remove('over');}));
  drop.addEventListener('drop',async e=>{
    const f=e.dataTransfer.files[0]; if(!f)return;
    let body; try{body=JSON.parse(await f.text());}catch{out.innerHTML='<span style="color:var(--fail)">Not valid JSON.</span>';return;}
    const v=await (await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    out.innerHTML=v.valid
      ? `<span style="color:var(--sig)">&#10003; VALID</span> &mdash; ${esc(v.algorithm||'')} &middot; ${esc(v.attestation_id||'')}`
      : `<span style="color:var(--fail)">&#10007; ${esc(v.error||'INVALID')}</span>`;
  });
}
loadRuns();
</script>
</body>
</html>
